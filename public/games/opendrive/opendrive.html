<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>OpenDrive Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
body{overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif;cursor:default;position:fixed;inset:0}
canvas{display:block}
#start-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,8,0.88);backdrop-filter:blur(24px);z-index:100;transition:opacity .9s ease}
#start-screen.hidden{opacity:0;pointer-events:none}
#start-screen h1{font-family:'Orbitron',monospace;font-size:clamp(32px,9vw,80px);font-weight:900;color:#ff6b00;letter-spacing:8px;text-shadow:0 0 60px rgba(255,107,0,0.35);margin-bottom:2px}
.subtitle{font-family:'Orbitron',monospace;font-size:clamp(10px,2vw,16px);font-weight:400;color:#777;letter-spacing:10px;margin-bottom:40px}
.input-group{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
.input-group label{font-size:11px;color:#666;letter-spacing:5px;margin-bottom:8px;text-transform:uppercase}
#room-input{width:170px;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,107,0,0.25);border-radius:8px;color:#fff;font-family:'Orbitron',monospace;font-size:22px;text-align:center;letter-spacing:8px;outline:none;transition:border-color .3s}
#room-input:focus{border-color:#ff6b00}
#start-btn{padding:14px 52px;background:linear-gradient(135deg,#ff6b00,#e85d00);border:none;border-radius:8px;color:#000;font-family:'Orbitron',monospace;font-size:14px;font-weight:700;letter-spacing:5px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-transform:uppercase}
#start-btn:hover{transform:scale(1.06);box-shadow:0 0 40px rgba(255,107,0,0.35)}
#start-btn:active{transform:scale(0.98)}
#network-status{margin-top:16px;font-size:12px;color:#555;letter-spacing:2px;min-height:18px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:50}
#speed-display{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:8px}
#speed-value{font-family:'Orbitron',monospace;font-size:clamp(36px,7vw,72px);font-weight:900;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,0.6)}
#speed-unit{font-family:'Orbitron',monospace;font-size:clamp(10px,1.5vw,14px);font-weight:400;color:#ff6b00;letter-spacing:3px}
#gear-display{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:clamp(14px,2vw,22px);font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:2px}
#minimap-container{position:absolute;top:12px;right:12px;width:clamp(100px,16vw,160px);height:clamp(100px,16vw,160px);border:2px solid rgba(255,107,0,0.4);border-radius:10px;overflow:hidden;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px)}
#minimap{width:100%;height:100%}
#players-online{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.po-label{font-size:9px;color:#666;letter-spacing:3px;text-transform:uppercase}
#player-count{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:#ff6b00}
#room-display{position:absolute;top:50px;left:12px;font-size:10px;color:#555;letter-spacing:2px}
#room-code{color:#ff6b00;font-family:'Orbitron',monospace;font-weight:700}
#coord-display{position:absolute;top:72px;left:12px;font-size:9px;color:#444;letter-spacing:1px;font-family:'Rajdhani',monospace}
#drift-indicator{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:#ff6b00;letter-spacing:6px;opacity:0;transition:opacity .15s}
#drift-indicator.active{opacity:1;text-shadow:0 0 20px rgba(255,107,0,0.6)}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
#touch-controls.active{display:block}
.tc-btn{pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:700;user-select:none;-webkit-user-select:none;transition:opacity .15s,transform .1s}
.tc-btn:active,.tc-btn.pressed{transform:scale(0.92)}
#steer-zone{position:absolute;left:0;bottom:0;width:42%;height:55%;pointer-events:auto}
#steer-wheel{position:absolute;bottom:20px;left:20px;width:clamp(110px,22vw,160px);height:clamp(110px,22vw,160px);border-radius:50%;border:3px solid rgba(255,107,0,0.35);background:rgba(255,107,0,0.06);pointer-events:none;display:flex;align-items:center;justify-content:center}
#steer-wheel::after{content:'';position:absolute;width:40%;height:3px;background:rgba(255,107,0,0.5);border-radius:2px}
#steer-wheel.left{border-color:rgba(255,107,0,0.7);background:rgba(255,107,0,0.12)}
#steer-wheel.right{border-color:rgba(255,107,0,0.7);background:rgba(255,107,0,0.12)}
#pedal-zone{position:absolute;right:0;bottom:0;width:36%;height:55%;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:12px;padding-bottom:20px}
.pedal{width:clamp(70px,16vw,100px);height:clamp(70px,16vw,100px);border-radius:50%;font-size:clamp(11px,2vw,15px);letter-spacing:1px}
#btn-gas{background:rgba(34,180,34,0.2);border:3px solid rgba(34,180,34,0.45);color:rgba(34,180,34,0.8)}
#btn-gas.pressed{background:rgba(34,180,34,0.4);border-color:rgba(34,180,34,0.8);color:rgba(34,180,34,1)}
#btn-brake{background:rgba(220,40,40,0.2);border:3px solid rgba(220,40,40,0.45);color:rgba(220,40,40,0.8)}
#btn-brake.pressed{background:rgba(220,40,40,0.4);border-color:rgba(220,40,40,0.8);color:rgba(220,40,40,1)}
#side-btns{position:absolute;right:0;bottom:56%;width:36%;display:flex;justify-content:center;gap:12px;pointer-events:auto}
.side-btn{width:clamp(50px,12vw,70px);height:clamp(50px,12vw,70px);font-size:clamp(8px,1.5vw,11px);letter-spacing:1px}
#btn-drift{background:rgba(255,107,0,0.15);border:2px solid rgba(255,107,0,0.35);color:rgba(255,107,0,0.7)}
#btn-drift.pressed{background:rgba(255,107,0,0.35);border-color:rgba(255,107,0,0.8);color:#ff6b00}
#btn-reset{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.4)}
#btn-reset.pressed{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.5);color:rgba(255,255,255,0.7)}
@media (hover:hover) and (pointer:fine){
  #touch-controls{display:none !important}
  #speed-display{bottom:36px;left:36px;transform:none}
  #gear-display{bottom:100px;left:40px;transform:none}
  #minimap-container{bottom:28px;right:28px;top:auto}
  #players-online{top:18px;right:28px;align-items:flex-end}
  #room-display{top:18px;left:28px}
  #coord-display{top:50px;left:28px}
  #controls-hint-desktop{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:2px;transition:opacity 2.5s ease;white-space:nowrap}
  #controls-hint-desktop.fade{opacity:0}
}
@media (hover:none),(pointer:coarse){#controls-hint-desktop{display:none}}
</style>

<body>
<div id="start-screen">
  <h1>OPENDRIVE</h1>
  <p class="subtitle">MULTIPLAYER</p>
  <div class="input-group">
    <label>Room Code</label>
    <input type="text" id="room-input" value="0001" maxlength="6" spellcheck="false" autocomplete="off">
  </div>
  <button id="start-btn">START DRIVING</button>
  <p id="network-status"></p>
</div>
<div id="hud" style="display:none">
  <div id="speed-display"><span id="speed-value">0</span><span id="speed-unit">MPH</span></div>
  <div id="gear-display">N</div>
  <div id="minimap-container"><canvas id="minimap" width="160" height="160"></canvas></div>
  <div id="players-online"><span class="po-label">Online</span><span id="player-count">1</span></div>
  <div id="room-display">ROOM <span id="room-code">0001</span></div>
  <div id="coord-display">X: 0  Z: 0</div>
  <div id="drift-indicator">DRIFT</div>
  <div id="controls-hint-desktop">WASD / Arrows - Drive &nbsp;&nbsp; SPACE - Drift &nbsp;&nbsp; R - Reset</div>
</div>
<div id="touch-controls">
  <div id="steer-zone"><div id="steer-wheel"></div></div>
  <div id="pedal-zone">
    <div id="btn-gas" class="tc-btn pedal">GAS</div>
    <div id="btn-brake" class="tc-btn pedal">BRK</div>
  </div>
  <div id="side-btns">
    <div id="btn-drift" class="tc-btn side-btn">DRIFT</div>
    <div id="btn-reset" class="tc-btn side-btn">RESET</div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ===================== CONSTANTS ===================== */
const WORLD_HALF = 950;
const ROAD_SPACING = 200;
const ROAD_HW = 7;
const ROAD_SMOOTH = 18;
const MAX_SPEED = 62;
const ACCEL = 28;
const BRAKE = 45;
const STEER_SPD = 2.0;
const MAX_STEER = 0.32;
const GRIP_NORM = 0.955;
const GRIP_DRIFT = 0.88;
const DRAG = 0.993;
const SEND_INT = 50;
const TREE_N = 500;
const TRAFFIC_N = 22;
const CAR_COLORS = [0x00e5ff,0x76ff03,0xff1744,0xd500f9,0xffea00,0x00e676,0x2979ff,0xff9100];
const PARTICLE_MAX = 250;
const SKID_MAX = 120;
const ROAD_SURFACE_Y = 0.12;
const ROAD_SNAP_THRESHOLD = 0.95; // roadInfl above this = force snap to ROAD_SURFACE_Y

/* ===================== STATE ===================== */
let scene, camera, renderer, clock;
let playerCar, vx = 0, vz = 0, heading = 0, speed = 0, steerAngle = 0;
let gameStarted = false;
let remotePlayers = {};
let peer = null, isHost = false, connections = [];
const myId = 'p' + Math.random().toString(36).substr(2, 7);
let lastSend = 0, currentRoom = '0001';
const keys = {};
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
let camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let introAngle = 0;
let currentLateralSpeed = 0, isCurrentlyDrifting = false, isCurrentlyBraking = false;
let isTouchDevice = false;

/* ===================== PARTICLE DATA ===================== */
const pPositions = new Float32Array(PARTICLE_MAX * 3);
const pSizes = new Float32Array(PARTICLE_MAX);
const pAlphas = new Float32Array(PARTICLE_MAX);
const pData = [];
let particleGeo, particleMesh, particleEmitTimer = 0;

/* ===================== SKID MARK DATA ===================== */
const skidPool = [];
let skidGeo, skidTimer = 0;

/* ===================== TOUCH ===================== */
let steerTouchId = null, steerStartX = 0, steerDeltaX = 0;
let gasTouchId = null, brakeTouchId = null, driftTouchId = null;

function detectTouch() {
  isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
  if (isTouchDevice) document.getElementById('touch-controls').classList.add('active');
}

function initTouchControls() {
  const steerZone = document.getElementById('steer-zone');
  const steerWheel = document.getElementById('steer-wheel');
  const btnGas = document.getElementById('btn-gas');
  const btnBrake = document.getElementById('btn-brake');
  const btnDrift = document.getElementById('btn-drift');
  const btnReset = document.getElementById('btn-reset');

  steerZone.addEventListener('touchstart', e => { e.preventDefault(); if (steerTouchId !== null) return; const t = e.changedTouches[0]; steerTouchId = t.identifier; steerStartX = t.clientX; steerDeltaX = 0; }, { passive: false });
  steerZone.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) { if (t.identifier === steerTouchId) steerDeltaX = t.clientX - steerStartX; } }, { passive: false });
  const endSteer = e => { for (const t of e.changedTouches) { if (t.identifier === steerTouchId) { steerTouchId = null; steerDeltaX = 0; steerWheel.classList.remove('left','right'); } } };
  steerZone.addEventListener('touchend', endSteer); steerZone.addEventListener('touchcancel', endSteer);

  btnGas.addEventListener('touchstart', e => { e.preventDefault(); gasTouchId = e.changedTouches[0].identifier; btnGas.classList.add('pressed'); }, { passive: false });
  const endGas = e => { for (const t of e.changedTouches) { if (t.identifier === gasTouchId) { gasTouchId = null; btnGas.classList.remove('pressed'); } } };
  btnGas.addEventListener('touchend', endGas); btnGas.addEventListener('touchcancel', endGas);

  btnBrake.addEventListener('touchstart', e => { e.preventDefault(); brakeTouchId = e.changedTouches[0].identifier; btnBrake.classList.add('pressed'); }, { passive: false });
  const endBrake = e => { for (const t of e.changedTouches) { if (t.identifier === brakeTouchId) { brakeTouchId = null; btnBrake.classList.remove('pressed'); } } };
  btnBrake.addEventListener('touchend', endBrake); btnBrake.addEventListener('touchcancel', endBrake);

  btnDrift.addEventListener('touchstart', e => { e.preventDefault(); driftTouchId = e.changedTouches[0].identifier; btnDrift.classList.add('pressed'); }, { passive: false });
  const endDrift = e => { for (const t of e.changedTouches) { if (t.identifier === driftTouchId) { driftTouchId = null; btnDrift.classList.remove('pressed'); } } };
  btnDrift.addEventListener('touchend', endDrift); btnDrift.addEventListener('touchcancel', endDrift);

  btnReset.addEventListener('touchstart', e => { e.preventDefault(); btnReset.classList.add('pressed'); keys['KeyR'] = true; setTimeout(() => { keys['KeyR'] = false; btnReset.classList.remove('pressed'); }, 200); }, { passive: false });
}

function getTouchSteer() {
  if (steerTouchId === null) return 0;
  const clamped = Math.max(-70, Math.min(70, steerDeltaX)) / 70;
  const wheel = document.getElementById('steer-wheel');
  if (clamped < -0.1) { wheel.classList.add('left'); wheel.classList.remove('right'); }
  else if (clamped > 0.1) { wheel.classList.add('right'); wheel.classList.remove('left'); }
  else wheel.classList.remove('left','right');
  return clamped;
}

/* ===================== AUDIO ===================== */
let audioCtx = null, engineOsc1, engineOsc2, engineGain, engineFilter;
let driftNoiseSource, driftNoiseGain, driftFilter;
let windNoiseSource, windNoiseGain, windFilter, audioInited = false;

function initAudio() {
  if (audioInited) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc1 = audioCtx.createOscillator(); engineOsc1.type = 'sawtooth'; engineOsc1.frequency.value = 80;
    engineOsc2 = audioCtx.createOscillator(); engineOsc2.type = 'sawtooth'; engineOsc2.frequency.value = 82;
    engineFilter = audioCtx.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.value = 400; engineFilter.Q.value = 2;
    engineGain = audioCtx.createGain(); engineGain.gain.value = 0;
    engineOsc1.connect(engineFilter); engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
    engineOsc1.start(); engineOsc2.start();
    const makeBuf = () => { const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
    driftNoiseSource = audioCtx.createBufferSource(); driftNoiseSource.buffer = makeBuf(); driftNoiseSource.loop = true;
    driftFilter = audioCtx.createBiquadFilter(); driftFilter.type = 'bandpass'; driftFilter.frequency.value = 2800; driftFilter.Q.value = 3;
    driftNoiseGain = audioCtx.createGain(); driftNoiseGain.gain.value = 0;
    driftNoiseSource.connect(driftFilter); driftFilter.connect(driftNoiseGain); driftNoiseGain.connect(audioCtx.destination); driftNoiseSource.start();
    windNoiseSource = audioCtx.createBufferSource(); windNoiseSource.buffer = makeBuf(); windNoiseSource.loop = true;
    windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 600; windFilter.Q.value = 0.7;
    windNoiseGain = audioCtx.createGain(); windNoiseGain.gain.value = 0;
    windNoiseSource.connect(windFilter); windFilter.connect(windNoiseGain); windNoiseGain.connect(audioCtx.destination); windNoiseSource.start();
    audioInited = true;
  } catch (e) { console.warn('Audio failed:', e); }
}

function updateAudio(dt) {
  if (!audioCtx || !audioInited) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime, sr = Math.abs(speed) / MAX_SPEED;
  const accel = keys['KeyW'] || keys['ArrowUp'] || gasTouchId !== null;
  const bf = 55 + sr * 165 + (accel ? sr * 30 : 0);
  engineOsc1.frequency.setTargetAtTime(bf, t, 0.05);
  engineOsc2.frequency.setTargetAtTime(bf + 2, t, 0.05);
  engineFilter.frequency.setTargetAtTime(250 + sr * 1550, t, 0.08);
  engineGain.gain.setTargetAtTime(Math.abs(speed) < 0.3 ? 0 : Math.min(0.12, sr * 0.12), t, 0.06);
  driftNoiseGain.gain.setTargetAtTime(isCurrentlyDrifting ? Math.min(0.09, (currentLateralSpeed / 20) * 0.09) : 0, t, 0.04);
  driftFilter.frequency.setTargetAtTime(2200 + currentLateralSpeed * 80, t, 0.03);
  windNoiseGain.gain.setTargetAtTime(Math.min(0.06, sr * sr * 0.06), t, 0.15);
  windFilter.frequency.setTargetAtTime(400 + sr * 1200, t, 0.2);
}

/* ===================== TERRAIN FUNCTIONS ===================== */
function terrainRaw(x, z) {
  let h = 0;
  h += Math.sin(x * 0.0048 + 0.3) * Math.cos(z * 0.0038) * 16;
  h += Math.sin(x * 0.014 + 1.7) * Math.cos(z * 0.011 + 0.5) * 7;
  h += Math.sin(x * 0.038 + 2.1) * Math.cos(z * 0.033 + 1.2) * 2.8;
  h += Math.sin(x * 0.085 + 0.5) * Math.cos(z * 0.072 + 2.3) * 1.2;
  return h;
}

function roadInfl(x, z) {
  let md = Infinity;
  const zm = ((z % ROAD_SPACING) + ROAD_SPACING) % ROAD_SPACING;
  md = Math.min(md, Math.min(zm, ROAD_SPACING - zm));
  const xm = ((x % ROAD_SPACING) + ROAD_SPACING) % ROAD_SPACING;
  md = Math.min(md, Math.min(xm, ROAD_SPACING - xm));
  if (md < ROAD_HW) return 1;
  if (md < ROAD_HW + ROAD_SMOOTH) return 1 - (md - ROAD_HW) / ROAD_SMOOTH;
  return 0;
}

/* Drive height: on road = ROAD_SURFACE_Y, off road = raw terrain, blend in transition */
function driveHeight(x, z) {
  const ri = roadInfl(x, z);
  if (ri >= 1.0) return ROAD_SURFACE_Y;
  return terrainRaw(x, z) * (1 - ri) + ROAD_SURFACE_Y * ri;
}

/* Terrain mesh height: same as driveHeight so mesh and car are ALWAYS in sync */
function tHeight(x, z) {
  return driveHeight(x, z);
}

/* ===================== SCENE SETUP ===================== */
function initScene() {
  scene = new THREE.Scene(); clock = new THREE.Clock();
  const skyC = document.createElement('canvas'); skyC.width = 2; skyC.height = 512;
  const sCtx = skyC.getContext('2d');
  const sg = sCtx.createLinearGradient(0, 0, 0, 512);
  sg.addColorStop(0, '#0a1a2e'); sg.addColorStop(0.3, '#163350');
  sg.addColorStop(0.55, '#c85a30'); sg.addColorStop(0.72, '#e8943a');
  sg.addColorStop(0.88, '#f5c96a'); sg.addColorStop(1.0, '#fae0a0');
  sCtx.fillStyle = sg; sCtx.fillRect(0, 0, 2, 512);
  scene.background = new THREE.CanvasTexture(skyC);
  scene.fog = new THREE.Fog(0xe89840, 350, 950);
  scene.add(new THREE.HemisphereLight(0xf5c96a, 0x2a4a1a, 0.55));
  const dl = new THREE.DirectionalLight(0xffe0b2, 1.3); dl.position.set(300, 400, 150); scene.add(dl);
  scene.add(new THREE.AmbientLight(0x404050, 0.25));
  camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 1200);
  camera.position.set(0, 30, -40);
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.prepend(renderer.domElement);
}

/* ===================== TERRAIN MESH ===================== */
function createTerrain() {
  const seg = 180;
  const geo = new THREE.PlaneGeometry(WORLD_HALF * 2, WORLD_HALF * 2, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = tHeight(x, z);
    pos.setY(i, y);
    const ri = roadInfl(x, z);
    if (ri > 0.95) {
      const rv = (Math.sin(x * 0.3 + z * 0.2) * 0.5 + 0.5) * 0.03;
      colors[i*3] = 0.16 + rv; colors[i*3+1] = 0.16 + rv; colors[i*3+2] = 0.17 + rv;
    } else {
      let r = 0.10 + ri * 0.06, g = 0.24 + y * 0.004, b = 0.06 + ri * 0.03;
      const brownF = Math.max(0, Math.sin(x * 0.018 + 3.7) * Math.cos(z * 0.022 + 1.2)) * 0.45;
      r += brownF * 0.38; g -= brownF * 0.08; b -= brownF * 0.02;
      const dirtF = Math.max(0, Math.sin(x * 0.013 + 0.5) * Math.cos(z * 0.016 + 2.8)) * 0.35;
      r += dirtF * 0.28; g += dirtF * 0.18; b -= dirtF * 0.03;
      const fine = Math.sin(x * 0.11 + z * 0.08) * 0.5 + 0.5;
      g += fine * 0.09; r += fine * 0.015; b += fine * 0.01;
      if (ri > 0.3) { const ef = (ri - 0.3) * 0.5; r += ef * 0.15; g -= ef * 0.04; }
      colors[i*3] = Math.max(0, Math.min(1, r));
      colors[i*3+1] = Math.max(0, Math.min(1, g));
      colors[i*3+2] = Math.max(0, Math.min(1, b));
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
}

/* ===================== PARTICLES ===================== */
function initParticles() {
  for (let i = 0; i < PARTICLE_MAX; i++) { pPositions[i*3+1] = -1000; pSizes[i] = 0; pAlphas[i] = 0; pData.push({ vx:0,vy:0,vz:0,life:0 }); }
  const tc = document.createElement('canvas'); tc.width = 64; tc.height = 64;
  const tctx = tc.getContext('2d');
  const grad = tctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(230,228,225,1.0)'); grad.addColorStop(0.25, 'rgba(200,198,195,0.7)');
  grad.addColorStop(0.6, 'rgba(160,158,155,0.25)'); grad.addColorStop(1.0, 'rgba(120,118,115,0.0)');
  tctx.fillStyle = grad; tctx.fillRect(0, 0, 64, 64);
  particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  particleGeo.setAttribute('aSize', new THREE.BufferAttribute(pSizes, 1));
  particleGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlphas, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: new THREE.CanvasTexture(tc) } },
    vertexShader: `attribute float aSize;attribute float aAlpha;varying float vAlpha;void main(){vAlpha=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=max(0.0,aSize*(200.0/-mv.z));gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `uniform sampler2D uTex;varying float vAlpha;void main(){vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<0.01)discard;gl_FragColor=vec4(0.78,0.76,0.73,t.a*vAlpha);}`,
    transparent: true, depthWrite: false
  });
  particleMesh = new THREE.Points(particleGeo, mat); particleMesh.frustumCulled = false; scene.add(particleMesh);
}

function emitSmoke(wx, wy, wz) {
  for (let i = 0; i < PARTICLE_MAX; i++) {
    if (pData[i].life <= 0) {
      pPositions[i*3] = wx + (Math.random()-0.5)*0.3; pPositions[i*3+1] = wy + Math.random()*0.2; pPositions[i*3+2] = wz + (Math.random()-0.5)*0.3;
      pData[i].vx = vx*0.3 + (Math.random()-0.5)*1.5; pData[i].vy = 0.8+Math.random()*1.2; pData[i].vz = vz*0.3 + (Math.random()-0.5)*1.5;
      pData[i].life = 1.0; pSizes[i] = 1.2+Math.random()*1.8; pAlphas[i] = 0.55+Math.random()*0.15; return;
    }
  }
}

function updateParticles(dt) {
  if (isCurrentlyDrifting && playerCar) {
    const intensity = Math.min(1, currentLateralSpeed / 12), interval = 0.04 / (0.3 + intensity * 0.7);
    particleEmitTimer += dt; const cosH = Math.cos(heading), sinH = Math.sin(heading);
    while (particleEmitTimer >= interval) {
      particleEmitTimer -= interval;
      emitSmoke(playerCar.position.x-1.15*cosH-1.4*sinH, playerCar.position.y+0.3, playerCar.position.z+1.15*sinH-1.4*cosH);
      emitSmoke(playerCar.position.x+1.15*cosH-1.4*sinH, playerCar.position.y+0.3, playerCar.position.z-1.15*sinH-1.4*cosH);
    }
  } else particleEmitTimer = 0;
  for (let i = 0; i < PARTICLE_MAX; i++) {
    const p = pData[i];
    if (p.life > 0) { p.life -= dt*0.7; pPositions[i*3] += p.vx*dt; pPositions[i*3+1] += p.vy*dt; pPositions[i*3+2] += p.vz*dt; p.vy += 0.3*dt; p.vx *= (1-dt*0.8); p.vz *= (1-dt*0.8); pAlphas[i] = Math.max(0,p.life*0.5); pSizes[i] += dt*2; }
    else { pPositions[i*3+1] = -1000; pAlphas[i] = 0; }
  }
  particleGeo.attributes.position.needsUpdate = true; particleGeo.attributes.aSize.needsUpdate = true; particleGeo.attributes.aAlpha.needsUpdate = true;
}

/* ===================== SKID MARKS ===================== */
function initSkidMarks() {
  skidGeo = new THREE.PlaneGeometry(0.28, 0.9); skidGeo.rotateX(-Math.PI / 2);
  for (let i = 0; i < SKID_MAX; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(skidGeo, mat); mesh.visible = false; scene.add(mesh);
    skidPool.push({ mesh, mat, life: 0, active: false });
  }
}

function placeSkid(lx, lz) {
  const cosH = Math.cos(heading), sinH = Math.sin(heading);
  const wx = playerCar.position.x + lx*cosH + lz*sinH, wz = playerCar.position.z - lx*sinH + lz*cosH;
  for (const s of skidPool) {
    if (!s.active) { s.mesh.position.set(wx, driveHeight(wx, wz) + 0.03, wz); s.mesh.rotation.y = heading; s.mesh.visible = true; s.active = true; s.life = 1.0; s.mat.opacity = 0.45; return; }
  }
}

function updateSkidMarks(dt) {
  for (const s of skidPool) {
    if (s.active) { s.life -= dt*0.12; if (s.life <= 0) { s.active = false; s.mesh.visible = false; s.mat.opacity = 0; } else s.mat.opacity = s.life*0.45; }
  }
}

/* ===================== INPUT ===================== */
function initInput() {
  window.addEventListener('keydown', e => { keys[e.code] = true; });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.addEventListener('touchmove', e => { if (gameStarted) e.preventDefault(); }, { passive: false });
}

/* ===================== PHYSICS ===================== */
function updatePhysics(dt) {
  dt = Math.min(dt, 0.05);
  const fwd = keys['KeyW'] || keys['ArrowUp'] || (gasTouchId !== null);
  const bck = keys['KeyS'] || keys['ArrowDown'] || (brakeTouchId !== null);
  const drift = keys['Space'] || (driftTouchId !== null);
  let kbSteer = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) kbSteer = 1;
  if (keys['KeyD'] || keys['ArrowRight']) kbSteer = -1;
  const steerInput = (kbSteer !== 0) ? kbSteer : getTouchSteer();

  if (keys['KeyR']) {
    playerCar.position.set(0, driveHeight(0, 0) + 0.15, 0);
    vx = 0; vz = 0; heading = 0; speed = 0; steerAngle = 0;
    keys['KeyR'] = false; return;
  }

  const fx = Math.sin(heading), fz = Math.cos(heading);
  speed = vx * fx + vz * fz;
  if (fwd) { const m = speed < -0.5 ? 2.5 : 1; vx += fx * ACCEL * m * dt; vz += fz * ACCEL * m * dt; }
  if (bck) { if (speed > 1.5) { vx -= fx * BRAKE * dt; vz -= fz * BRAKE * dt; } else { vx -= fx * ACCEL * 0.45 * dt; vz -= fz * ACCEL * 0.45 * dt; } }

  let ts = steerInput * MAX_STEER;
  ts *= (1 - (Math.abs(speed) / MAX_SPEED) * 0.4);
  steerAngle += (ts - steerAngle) * Math.min(1, STEER_SPD * dt);
  if (Math.abs(speed) > 0.3) heading += steerAngle * speed * 0.016 * dt * 60;

  const grip = drift ? GRIP_DRIFT : GRIP_NORM;
  const nfx = Math.sin(heading), nfz = Math.cos(heading);
  const ns = vx * nfx + vz * nfz;
  const lx = vx - nfx * ns, lz = vz - nfz * ns;
  const gf = Math.pow(grip, dt * 60);
  vx = nfx * ns + lx * gf; vz = nfz * ns + lz * gf;
  const df = Math.pow(DRAG, dt * 60); vx *= df; vz *= df;
  speed = Math.sqrt(vx * vx + vz * vz);
  if (speed > MAX_SPEED) { const r = MAX_SPEED / speed; vx *= r; vz *= r; speed = MAX_SPEED; }

  playerCar.position.x += vx * dt; playerCar.position.z += vz * dt;
  playerCar.position.x = Math.max(-WORLD_HALF + 5, Math.min(WORLD_HALF - 5, playerCar.position.x));
  playerCar.position.z = Math.max(-WORLD_HALF + 5, Math.min(WORLD_HALF - 5, playerCar.position.z));

  /* CRITICAL FIX: get height, then clamp to road surface as absolute floor */
  const targetY = driveHeight(playerCar.position.x, playerCar.position.z) + 0.15;
  playerCar.position.y = Math.max(targetY, ROAD_SURFACE_Y + 0.15);

  playerCar.rotation.y = heading;
  playerCar.rotation.z = THREE.MathUtils.lerp(playerCar.rotation.z, -steerAngle * speed * 0.001, 0.08);

  currentLateralSpeed = Math.sqrt(lx * lx + lz * lz);
  isCurrentlyDrifting = drift && currentLateralSpeed > 5 && speed > 12;
  isCurrentlyBraking = bck && speed > 1.5;
  playerCar.userData.tailLights.forEach(tl => { tl.material.emissiveIntensity = isCurrentlyBraking ? 2.0 : 0; });
  const driftEl = document.getElementById('drift-indicator');
  if (isCurrentlyDrifting) driftEl.classList.add('active'); else driftEl.classList.remove('active');
  if (isCurrentlyDrifting || isCurrentlyBraking) { skidTimer += dt; if (skidTimer > 0.04) { skidTimer = 0; placeSkid(-1.15, -1.4); placeSkid(1.15, -1.4); } } else skidTimer = 0;
}

/* ===================== CAMERA ===================== */
function updateCamera(dt) {
  const behind = 14 + speed * 0.06, height = 5.5 + speed * 0.02;
  const fx = Math.sin(heading), fz = Math.cos(heading);
  const tP = new THREE.Vector3(playerCar.position.x - fx*behind, playerCar.position.y + height, playerCar.position.z - fz*behind);
  const tL = new THREE.Vector3(playerCar.position.x + fx*6, playerCar.position.y + 1.5, playerCar.position.z + fz*6);
  const lf = 1 - Math.pow(0.02, dt);
  camPos.lerp(tP, lf); camLook.lerp(tL, lf * 1.2);
  camera.position.copy(camPos); camera.lookAt(camLook);
  const sr = speed / MAX_SPEED, shake = Math.max(0, (sr - 0.85) / 0.15) * 0.18;
  if (shake > 0.001) { camera.position.x += (Math.random()-0.5)*shake*2; camera.position.y += (Math.random()-0.5)*shake; camera.position.z += (Math.random()-0.5)*shake*2; }
  camera.fov = 62 + sr * 18; camera.updateProjectionMatrix();
}

/* ===================== NETWORKING ===================== */
function initNetwork(room) {
  currentRoom = room; const hostId = 'od-mp-' + room;
  const sEl = document.getElementById('network-status'); sEl.textContent = 'Connecting...';
  try {
    peer = new Peer(hostId, { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
    peer.on('open', () => { isHost = true; sEl.textContent = 'Hosting room ' + room; peer.on('connection', c => { connections.push(c); wireConn(c); }); });
    peer.on('error', e => { if (e.type === 'unavailable-id') { peer.destroy(); becomeClient(hostId, sEl, room); } else sEl.textContent = 'Playing solo'; });
  } catch (e) { sEl.textContent = 'Playing solo'; }
}
function becomeClient(hid, sEl, room) {
  try {
    peer = new Peer(undefined, { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
    peer.on('open', () => { isHost = false; const c = peer.connect(hid, { reliable: false, serialization: 'json' }); c.on('open', () => { connections.push(c); wireConn(c); c.send({ t:'join', id:myId }); sEl.textContent = 'Connected to room ' + room; }); c.on('error', () => { sEl.textContent = 'Room not found — solo'; }); setTimeout(() => { if (!connections.length) sEl.textContent = 'Room not found — solo'; }, 5000); });
    peer.on('error', () => { sEl.textContent = 'Playing solo'; });
  } catch (e) { sEl.textContent = 'Playing solo'; }
}
function wireConn(c) {
  c.on('data', d => { if (d.t==='pos') { updateRemote(d.id,d.x,d.y,d.z,d.r); if(isHost) broadcast(d,c); } else if (d.t==='join') { updateRemote(d.id,0,0,0,0); if(isHost){ for(const rid in remotePlayers){const rp=remotePlayers[rid];c.send({t:'pos',id:rid,x:rp.tx,y:rp.ty,z:rp.tz,r:rp.tr});} broadcast(d,c);} } else if(d.t==='leave'){removeRemote(d.id);if(isHost)broadcast(d,c);} });
  c.on('close', () => { connections = connections.filter(x => x !== c); });
}
function broadcast(d, ex) { connections.forEach(c => { if (c !== ex && c.open) c.send(d); }); }
function sendPos() { const n = performance.now(); if (n - lastSend < SEND_INT) return; lastSend = n; const d = { t:'pos', id:myId, x:playerCar.position.x, y:playerCar.position.y, z:playerCar.position.z, r:heading }; connections.forEach(c => { if (c.open) c.send(d); }); }
function colorForId(id) { let h = 0; for (let i = 0; i < id.length; i++) h = ((h << 5) - h) + id.charCodeAt(i); return CAR_COLORS[Math.abs(h) % CAR_COLORS.length]; }
function updateRemote(id, x, y, z, r) {
  if (id === myId) return;
  if (!remotePlayers[id]) { const car = buildCar(colorForId(id)); car.scale.set(0.95,0.95,0.95); scene.add(car); remotePlayers[id] = { mesh:car, tx:x, ty:y, tz:z, tr:r, last:performance.now() }; }
  else { const rp = remotePlayers[id]; rp.tx=x; rp.ty=y; rp.tz=z; rp.tr=r; rp.last=performance.now(); }
}
function removeRemote(id) { if (remotePlayers[id]) { scene.remove(remotePlayers[id].mesh); delete remotePlayers[id]; } }
function updateRemotes(dt) {
  const n = performance.now(), lf = 1 - Math.pow(0.005, dt);
  for (const id in remotePlayers) {
    const rp = remotePlayers[id];
    rp.mesh.position.x += (rp.tx-rp.mesh.position.x)*lf; rp.mesh.position.y += (rp.ty-rp.mesh.position.y)*lf; rp.mesh.position.z += (rp.tz-rp.mesh.position.z)*lf;
    let rd = rp.tr - rp.mesh.rotation.y; while(rd>Math.PI) rd-=Math.PI*2; while(rd<-Math.PI) rd+=Math.PI*2;
    rp.mesh.rotation.y += rd*lf; if (n-rp.last>12000) removeRemote(id);
  }
}

/* ===================== HUD ===================== */
function updateHUD() {
  const mph = Math.round(speed * 2.237);
  document.getElementById('speed-value').textContent = mph;
  let gear = 'N';
  if (speed > 0.5) { if (mph<30) gear='1'; else if (mph<55) gear='2'; else if (mph<80) gear='3'; else if (mph<105) gear='4'; else if (mph<125) gear='5'; else gear='6'; }
  else if (speed < -0.5) gear = 'R';
  document.getElementById('gear-display').textContent = gear;
  document.getElementById('player-count').textContent = 1 + Object.keys(remotePlayers).length;
  document.getElementById('coord-display').textContent = `X: ${Math.round(playerCar.position.x)}  Z: ${Math.round(playerCar.position.z)}`;
}

/* ===================== MINIMAP ===================== */
function drawMinimap() {
  const w = mmCanvas.width, h = mmCanvas.height, scale = w/420, cx = w/2, cy = h/2;
  const px = playerCar.position.x, pz = playerCar.position.z;
  mmCtx.fillStyle = '#0f1f0f'; mmCtx.fillRect(0, 0, w, h);
  mmCtx.strokeStyle = '#3a3a3a'; mmCtx.lineWidth = Math.max(2, ROAD_HW*2*scale);
  for (let r = -WORLD_HALF; r <= WORLD_HALF; r += ROAD_SPACING) {
    const sy = cy+(r-pz)*scale; if(sy>-50&&sy<h+50){mmCtx.beginPath();mmCtx.moveTo(0,sy);mmCtx.lineTo(w,sy);mmCtx.stroke();}
    const sx = cx+(r-px)*scale; if(sx>-50&&sx<w+50){mmCtx.beginPath();mmCtx.moveTo(sx,0);mmCtx.lineTo(sx,h);mmCtx.stroke();}
  }
  mmCtx.strokeStyle='#555';mmCtx.lineWidth=1;mmCtx.setLineDash([3,3]);
  for (let r = -WORLD_HALF; r <= WORLD_HALF; r += ROAD_SPACING) {
    const sy = cy+(r-pz)*scale; if(sy>-50&&sy<h+50){mmCtx.beginPath();mmCtx.moveTo(0,sy);mmCtx.lineTo(w,sy);mmCtx.stroke();}
    const sx = cx+(r-px)*scale; if(sx>-50&&sx<w+50){mmCtx.beginPath();mmCtx.moveTo(sx,0);mmCtx.lineTo(sx,h);mmCtx.stroke();}
  }
  mmCtx.setLineDash([]);
  for (const id in remotePlayers) { const rp=remotePlayers[id]; const rx=cx+(rp.mesh.position.x-px)*scale, ry=cy+(rp.mesh.position.z-pz)*scale; if(rx>0&&rx<w&&ry>0&&ry<h){mmCtx.fillStyle='#'+colorForId(id).toString(16).padStart(6,'0');mmCtx.beginPath();mmCtx.arc(rx,ry,3.5,0,Math.PI*2);mmCtx.fill();} }
  mmCtx.fillStyle='#ff6b00';mmCtx.beginPath();mmCtx.arc(cx,cy,4.5,0,Math.PI*2);mmCtx.fill();
  mmCtx.strokeStyle='#ff6b00';mmCtx.lineWidth=2;mmCtx.beginPath();mmCtx.moveTo(cx,cy);mmCtx.lineTo(cx+Math.sin(heading)*10,cy-Math.cos(heading)*10);mmCtx.stroke();
  mmCtx.strokeStyle='rgba(255,107,0,0.35)';mmCtx.lineWidth=1.5;mmCtx.strokeRect(0,0,w,h);
}

/* ===================== INTRO ===================== */
function updateIntroCamera(dt) { introAngle += dt*0.15; camera.position.set(Math.sin(introAngle)*60,35,Math.cos(introAngle)*60); camera.lookAt(0,0,0); }

/* ===================== MAIN LOOP ===================== */
function gameLoop() {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!gameStarted) { updateIntroCamera(dt); renderer.render(scene, camera); return; }
  updatePhysics(dt); updateCamera(dt); updateRemotes(dt); updateParticles(dt); updateSkidMarks(dt); sendPos(); updateAudio(dt); updateHUD(); drawMinimap();
  renderer.render(scene, camera);
}

/* ===================== RESIZE ===================== */
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ===================== START GAME ===================== */
function startGame() {
  const room = document.getElementById('room-input').value.trim() || '0001';
  document.getElementById('room-code').textContent = room;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('hud').style.display = 'block';
  gameStarted = true;
  const fx = Math.sin(heading), fz = Math.cos(heading);
  camPos.set(playerCar.position.x-fx*14, playerCar.position.y+5.5, playerCar.position.z-fz*14);
  camLook.set(playerCar.position.x+fx*6, playerCar.position.y+1.5, playerCar.position.z+fz*6);
  initAudio(); initNetwork(room);
  const dh = document.getElementById('controls-hint-desktop');
  if (dh) setTimeout(() => dh.classList.add('fade'), 6000);
}

/* ===================== INIT ===================== */
function init() {
  detectTouch();
  initScene(); createTerrain(); createRoads(); createMarkings(); createTrees(); createLights(); createTraffic();
  initParticles(); initSkidMarks(); initPlayer(); initInput();
  if (isTouchDevice) initTouchControls();
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('room-input').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  gameLoop();
}
init();
</script>
